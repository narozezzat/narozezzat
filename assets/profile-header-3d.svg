<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Naroz Ezzat — Front-end developer</title><desc id="desc">Floating React, JavaScript and Next.js tiles surround a dimensional code window. Building for the web, always learning.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101428"/><stop offset="1" stop-color="#181333"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#6554C0" stop-opacity=".48"/><stop offset="1" stop-color="#6554C0" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x2="1" y2="1"><stop stop-color="#A8A1FF"/><stop offset=".5" stop-color="#6554C0"/><stop offset="1" stop-color="#56D5EE"/></linearGradient>
<linearGradient id="face" x2=".7" y2="1"><stop stop-color="#FAFBFF"/><stop offset="1" stop-color="#B9C5E9"/></linearGradient>
<linearGradient id="screen" x2="1" y2="1"><stop stop-color="#242D4B"/><stop offset="1" stop-color="#141A32"/></linearGradient>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="17" stdDeviation="15" flood-color="#03040F" flood-opacity=".6"/></filter>
</defs><style>
.float-a{animation:float 6s ease-in-out infinite}.float-b{animation:float 7s ease-in-out -2s infinite}.float-c{animation:float 8s ease-in-out -4s infinite}
.cursor{animation:blink 1.8s steps(2,end) infinite}.spark{animation:shine 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{50%{opacity:0}}@keyframes shine{0%,100%{opacity:.25}50%{opacity:.85}}
@media(prefers-reduced-motion:reduce){.float-a,.float-b,.float-c,.cursor,.spark{animation:none}}
</style>
