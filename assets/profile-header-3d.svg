<text x="64" y="240" fill="#94E9F7" font-size="30" font-weight="600">Front-end developer</text>
<text x="64" y="302" fill="#CFD2E8" font-size="23">Building for the web.</text>
<text x="64" y="338" fill="#CFD2E8" font-size="23">Always learning something new.</text>
